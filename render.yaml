services:
  - type: web
    name: meal-planner-api
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "npm ci && npx prisma generate && npm run build"
    startCommand: "npx prisma migrate deploy && node dist/index.js"
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: meal-planner-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://YOUR_FRONTEND_URL.vercel.app

databases:
  - name: meal-planner-db
    databaseName: meal_planner
    user: meal_planner_user
    plan: free
